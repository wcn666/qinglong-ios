name: Build iOS IPA

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                  # 推 v 开头的 tag 也触发

jobs:
  build-ios:
    runs-on: macos-latest          # 固定 macOS 14，Xcode 15 兼容 Flutter 3.3.10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter 3.3.10（与项目 Dart 2.18 匹配）
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.3.10'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned IPA
        run: flutter build ipa --release --no-codesign

      - name: Build IPA from xcarchive (no-codesign)
        run: |
          echo "=== archive 内容 ==="
          find build/ios/archive/Runner.xcarchive/Products -maxdepth 3 -name "*.app"
          APP=$(find build/ios/archive/Runner.xcarchive/Products -maxdepth 3 -name "Runner.app" | head -1)
          if [ -z "$APP" ]; then echo "找不到 Runner.app"; exit 1; fi
          mkdir -p output/Payload
          cp -R "$APP" output/Payload/
          cd output
          zip -qry qinglong-2.22-adapted.ipa Payload
          rm -rf Payload
          ls -lh *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-ios-ipa
          path: output/*.ipa
          retention-days: 30
